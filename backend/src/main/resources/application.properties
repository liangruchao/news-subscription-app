# 服务器配置
server.port=8081

# 应用名称
spring.application.name=news-subscription-app

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/news_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:apeng320}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache 配置 - 临时禁用Redis
spring.cache.type=none
# spring.cache.type=redis
# spring.cache.redis.time-to-live=600000
# spring.cache.redis.cache-null-values=false

# NewsAPI 配置
newsapi.api-key=${NEWSAPI_API_KEY:#{null}}
newsapi.base-url=https://newsapi.org/v2
newsapi.page-size=10

# Session 配置
server.servlet.session.timeout=30m
spring.session.store-type=none

# Jackson 配置
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# 日志配置
logging.level.com.newsapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# RSS抓取配置
rss.fetch.timeout=10000
rss.fetch.retry.max=3
rss.fetch.cron=0 */30 * * * ?

# OPML导入配置
opml.import.max.feeds=100
opml.import.file.max.size=10485760

# 文章分享配置
share.default.expire.days=7

# 全文搜索配置
search.max.results=100
